<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 파비콘 아이콘 넣기 -->
    <link rel="icon" href="images/파비콘아이콘.png" />
    <title>shillagotels</title>

    <!-- css연결 -->
    <link rel="stylesheet" href="css/header.css" />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/visual.css" />
    <link rel="stylesheet" href="css/footer.css" />

    <!-- JS -->
    <link rel="stylesheet" href="js/main.js" />
  </head>

  <body>
    <!-- 전체 레이아웃 -->
    <div class="wap">
      <!-- 상단 -->
      <div class="header">
        <div class="inner">
          <!-- 좌측상단 -->
          <div class="header-L">
            <ul class="ut-list">
              <li>
                <!-- 이 <a> 태그 안에 홈 아이콘, 텍스트, 플러스 아이콘을 다 넣습니다! -->
                <a href="#" class="home-link">
                  <img src="images/images_imoje/home.png" alt="home" />
                  <span>호텔바로가기</span>
                  <img src="images/images_imoje/addition.png" alt="plus" />
                </a>
              </li>
            </ul>
          </div>
          <!-- 로고 -->
          <div class="logoim">
            <h1><img src="images/파비콘아이콘.png" alt="logo" /></h1>
          </div>
          <!-- 우측상단 -->
          <div class="header-R">
            <ul class="header-ul">
              <!-- 각각의 메뉴를 li로 낱개로 쪼개기!! -->
              <li><a href="#">로그인</a></li>
              <li><a href="#">회원가입</a></li>
              <li><a href="#">예약확인</a></li>
              <li><a href="#">멤버십</a></li>
              <li><a href="#">호텔찾기</a></li>

              <!-- 다국어 메뉴 -->
              <li class="lang-menu">
                <a href="#" class="lang-btn">
                  <img src="images/images_imoje/earth.png" alt="earth" />
                  한국어
                  <img src="images/images_imoje/down.png" alt="down" />
                </a>
                <ul class="lang-sub">
                  <li><a href="#">한국어</a></li>
                  <li><a href="#">English</a></li>
                  <li><a href="#">日本語</a></li>
                  <li><a href="#">中國語</a></li>
                </ul>
              </li>
            </ul>
          </div>
        </div>

        <!-- H 메뉴 -->
        <nav class="menu">
          <ul class="nav">
            <li><a href="#">호텔</a></li>
            <li><a href="#">오퍼</a></li>
            <li><a href="#">멤버십</a></li>
          </ul>
        </nav>
        <!-- 예약창 -->
        <div class="reservation inner" >
          <!-- 객실다이닝버튼 -->
          <div class="rsr-bor">
            <button type="button" class="rsr-Btn">객실</button>
            <button type="button" class="rsr-Btn">다이닝</button>
          </div>
          <!-- 예약창선택창 -->
          <div class="open">
            <div class="open-but">
              <!-- 검색창 현재는 다이닝 기준으로 적음  -->
              <span class="text"> 호텔을 선택해주세요 </span>
              <!-- 메뉴 눌러서 검색창에 인식되게? -->
              <img src="images/images_imoje/position-위치.png" alt="position" />
            </div>
            <!-- z -->
            <div class="open-but">
              <span class="text">다이닝을 선택해주세요</span>
              <img src="images/images_imoje/dish.png" alt="dish" />
            </div>
            <div class="open-but">
              <span class="text">선택 · 성인2 어린이0 유아 0</span>
              <img src="images/images_imoje/User.png" alt="user" />
            </div>
          </div>

          <!-- 예약하기 버튼!! -->
          <button type="button" class="reservation-btn">예약하기</button>
        </div>
        <!-- 서브메뉴 click시  나오는 박스는 나중에!!-->
        <div class="open" id="subBox">
          <div class="tittle"></div>
        </div>
      </div>
      <!-- 비주얼 -->
      <div class="visual">
        <!-- 난 비디오 보고 난 다음차례에 배너 로 넘어아게 -->
        <video autoplay loop muted>
          <!-- <source src="images/배너 영상.mp4" type="video/mp4"> -->
        </video>
        <div class="visual-inner">
          <img src="images/라이브.jpeg" alt="img">
          <ul>
            <li>
              <p>제주신라호텔</p>
              <h2>Wine & Jass Night</h2>
              <h3>라이브 재즈 공연과 와인 한잔으로 즐기는 낭만 가득한 가을밤</h3>
              <a href="#">패키지바로가기</a>
            </li>
          </ul>
        </div>
      </div>



      <!-- 메인 -->
      <!-- 하단 -->
    </div>
  </body>
</html>
